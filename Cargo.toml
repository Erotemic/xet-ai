[package]
name = "xet-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
walkdir = "2"

# xet-core local CAS implementation
data = { git = "https://github.com/huggingface/xet-core", package = "data", branch = "main" }
file_reconstruction = { git = "https://github.com/huggingface/xet-core", package = "file_reconstruction", branch = "main" }
xet_runtime = { git = "https://github.com/huggingface/xet-core", package = "xet_runtime", branch = "main" }
